<!DOCTYPE html>
<html lang="ar" dir="rtl" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تأكيد الطلب | مرتاح دجاج</title>
  
  <link rel="stylesheet" href="main.css">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              primary: '#8b0000',
              gold: '#D4AF37',
              dark: '#0f0505',
              surface: '#1a0a0a',
            }
          }
        },
      },
    };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-[#fdfcfb] dark:bg-brand-dark text-brand-dark dark:text-white" x-data="orderFlow()">

  <!-- Compact Premium Header -->
  <header class="py-6 px-4 mb-8">
    <div class="container mx-auto flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2">
        <span class="material-symbols-outlined text-brand-primary">arrow_forward</span>
        <span class="font-bold">العودة للرئيسية</span>
      </a>
      <div class="text-xl font-black">مرتاح <span class="text-brand-gold">دجاج</span></div>
      <div class="size-8"></div> <!-- Spacer -->
    </div>
  </header>

  <main class="container mx-auto px-4 pb-24">
    <div class="max-w-4xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-12">
      
      <!-- Order Form -->
      <div class="lg:col-span-7 space-y-8 animate-fade-in-up">
        <div class="space-y-2">
          <h1 class="text-4xl font-black">تفاصيل الطلب</h1>
          <p class="text-gray-500 dark:text-gray-400 text-lg">أكمل بياناتك لتأكيد الطلب عبر واتساب</p>
        </div>

        <!-- Form Steps -->
        <div class="bg-white dark:bg-brand-surface p-8 rounded-[2rem] border border-black/5 dark:border-white/5 shadow-xl space-y-8">
          
          <!-- Tab Switcher -->
          <div class="flex p-1 bg-gray-100 dark:bg-black/20 rounded-2xl">
             <button @click="activeTab = 'regular'" :class="activeTab === 'regular' ? 'bg-white dark:bg-brand-surface shadow-md' : 'text-gray-500'" class="flex-1 py-3 rounded-xl font-bold transition-all">طلب عادي</button>
             <button @click="activeTab = 'catering'" :class="activeTab === 'catering' ? 'bg-white dark:bg-brand-surface shadow-md' : 'text-gray-500'" class="flex-1 py-3 rounded-xl font-bold transition-all">عزومة 👨‍👩‍👧‍👦</button>
          </div>

          <div class="space-y-6">
            <!-- Selected Meal -->
            <div class="p-4 rounded-2xl bg-brand-gold/10 border border-brand-gold/20 flex justify-between items-center">
              <div>
                <div class="text-xs font-bold text-brand-gold uppercase tracking-widest mb-1">الوجبة المختارة</div>
                <div class="text-xl font-black" x-text="mealName"></div>
              </div>
              <div class="text-right">
                 <div class="text-xs text-gray-400">سعر الوحدة</div>
                 <div class="font-bold" x-text="`${mealPrice} ج.م` font-bold"></div>
              </div>
            </div>

            <!-- Quantity -->
            <div>
              <label class="block font-bold mb-3">عدد الوجبات</label>
              <div class="flex items-center gap-4">
                <button @click="qty > 1 ? qty-- : null; calculate()" class="size-12 rounded-xl bg-gray-100 dark:bg-white/5 flex items-center justify-center hover:bg-brand-primary hover:text-white transition-colors">-</button>
                <input type="number" x-model="qty" @input="calculate()" class="w-20 text-center text-xl font-black bg-transparent border-none focus:ring-0">
                <button @click="qty++; calculate()" class="size-12 rounded-xl bg-gray-100 dark:bg-white/5 flex items-center justify-center hover:bg-brand-primary hover:text-white transition-colors">+</button>
              </div>
            </div>

            <!-- Add-ons -->
            <div>
               <label class="block font-bold mb-4">إضافات مميزة ✨</label>
               <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                 <template x-for="addon in addons" :key="addon.id">
                    <button @click="toggleAddon(addon)" :class="isAddonSelected(addon) ? 'border-brand-primary bg-brand-primary/5' : 'border-black/5 dark:border-white/5 bg-gray-50 dark:bg-white/5'" class="flex items-center justify-between p-4 rounded-2xl border transition-all text-right">
                      <div>
                        <div class="font-bold" x-text="addon.name"></div>
                        <div class="text-xs text-gray-500" x-text="`+ ${addon.price} ج.م`"></div>
                      </div>
                      <span class="material-symbols-outlined text-brand-primary" x-show="isAddonSelected(addon)">check_circle</span>
                    </button>
                 </template>
               </div>
            </div>

            <hr class="border-black/5 dark:border-white/5">

            <!-- Personal Info -->
            <div class="space-y-4">
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="space-y-2">
                  <label class="text-sm font-bold opacity-60">الاسم بالكامل</label>
                  <input type="text" x-model="name" placeholder="محمد أحمد" class="w-full px-5 py-3 rounded-2xl bg-gray-50 dark:bg-white/5 border-none focus:ring-2 focus:ring-brand-gold">
                </div>
                <div class="space-y-2">
                  <label class="text-sm font-bold opacity-60">رقم الموبايل</label>
                  <input type="tel" x-model="phone" placeholder="01xxxxxxxxx" class="w-full px-5 py-3 rounded-2xl bg-gray-50 dark:bg-white/5 border-none focus:ring-2 focus:ring-brand-gold">
                </div>
              </div>
              <div class="space-y-2">
                <label class="text-sm font-bold opacity-60">العنوان بالتفصيل</label>
                <textarea x-model="address" placeholder="الحي، الشارع، رقم الشقة..." class="w-full px-5 py-3 rounded-2xl bg-gray-50 dark:bg-white/5 border-none focus:ring-2 focus:ring-brand-gold h-24"></textarea>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Order Summary (Sticky) -->
      <div class="lg:col-span-5">
        <div class="sticky top-24 space-y-6 animate-fade-in-up [animation-delay:200ms]">
          <div class="bg-brand-dark text-white p-8 rounded-[2rem] shadow-2xl overflow-hidden relative">
            <div class="absolute -top-10 -right-10 size-40 bg-brand-primary/20 blur-3xl rounded-full"></div>
            
            <h2 class="text-2xl font-black mb-8 relative z-10">ملخص الطلب</h2>
            
            <div class="space-y-4 relative z-10">
              <div class="flex justify-between items-center opacity-70">
                <span>الوجبة (${qty})</span>
                <span x-text="`${qty * mealPrice} ج.م`"></span>
              </div>
              
              <template x-for="a in selectedAddons" :key="a.id">
                <div class="flex justify-between items-center opacity-70">
                  <span x-text="a.name"></span>
                  <span x-text="`${a.price} ج.م`"></span>
                </div>
              </template>

              <div class="h-px bg-white/10 my-6"></div>

              <div class="flex justify-between items-end">
                <div>
                  <div class="text-xs uppercase tracking-widest opacity-50 mb-1">الإجمالي الكلي</div>
                  <div class="text-4xl font-black text-brand-gold" x-text="`${total} ج.م` font-black text-brand-gold"></div>
                </div>
                <div class="text-xs opacity-50">+ مصاريف التوصيل</div>
              </div>
            </div>

            <button @click="submitOrder" class="w-full mt-10 bg-brand-gold text-brand-dark py-5 rounded-2xl font-black text-xl flex items-center justify-center gap-3 hover:bg-white transition-all active:scale-95 group">
              <span>تأكيد الطلب الآن</span>
              <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" class="size-6 group-hover:scale-125 transition-transform" alt="WA">
            </button>
            
            <p class="text-center mt-6 text-sm opacity-40">سيتم توجيهك إلى واتساب لإتمام الطلب</p>
          </div>

          <!-- Trust Badges -->
          <div class="grid grid-cols-2 gap-4">
             <div class="p-4 rounded-2xl bg-white dark:bg-brand-surface border border-black/5 dark:border-white/5 text-center">
                <span class="material-symbols-outlined text-brand-gold text-3xl mb-2">speed</span>
                <div class="text-xs font-bold">توصيل سريع</div>
             </div>
             <div class="p-4 rounded-2xl bg-white dark:bg-brand-surface border border-black/5 dark:border-white/5 text-center">
                <span class="material-symbols-outlined text-brand-gold text-3xl mb-2">verified</span>
                <div class="text-xs font-bold">مكونات طازجة</div>
             </div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script>
    function orderFlow() {
      const MEAL_PRICES = {
        "وجبه النص فرخه": 222,
        "وجبه الفرخه الكامله": 444
      };

      const urlParams = new URLSearchParams(window.location.search);
      const mealName = urlParams.get("meal") || "وجبة مخصصة";

      return {
        activeTab: 'regular',
        mealName,
        mealPrice: MEAL_PRICES[mealName] || 222,
        qty: 1,
        name: '',
        phone: '',
        address: '',
        total: 0,
        addons: [
          { id: 'rice_pudding', name: 'رز بلبن', price: 15 },
          { id: 'daqoos', name: 'دقوس إضافي', price: 7 },
          { id: 'honey', name: 'عسل إضافي', price: 10 },
          { id: 'yogurt', name: 'رايب', price: 20 },
          { id: 'water_s', name: 'مياه معدنية', price: 5 }
        ],
        selectedAddons: [],

        init() { this.calculate() },

        calculate() {
          let addonTotal = this.selectedAddons.reduce((sum, a) => sum + a.price, 0);
          this.total = (this.qty * this.mealPrice) + addonTotal;
        },

        toggleAddon(addon) {
          const index = this.selectedAddons.findIndex(a => a.id === addon.id);
          if (index > -1) this.selectedAddons.splice(index, 1);
          else this.selectedAddons.push(addon);
          this.calculate();
        },

        isAddonSelected(addon) {
          return this.selectedAddons.some(a => a.id === addon.id);
        },

        submitOrder() {
          if (!this.name || !this.phone || !this.address) return alert("يرجى ملء جميع البيانات الأساسية");
          
          let serial = localStorage.getItem('orderSerial') || 1000;
          serial = parseInt(serial) + 1;
          localStorage.setItem('orderSerial', serial);

          const time = new Date().toLocaleTimeString('ar-EG');
          
          let msg = `*Order Serial:* #${serial}\n*Time:* ${time}\n\n`;
          msg += `*طلب جديد من مرتاح دجاج* 🍗\n\n`;
          msg += `*الاسم:* ${this.name}\n`;
          msg += `*الموبايل:* ${this.phone}\n`;
          msg += `*العنوان:* ${this.address}\n\n`;
          msg += `*-- الوجبة --*\n`;
          msg += `${this.mealName} × ${this.qty}\n\n`;
          
          if (this.selectedAddons.length > 0) {
            msg += `*-- الإضافات --*\n`;
            this.selectedAddons.forEach(a => msg += `- ${a.name}\n`);
            msg += `\n`;
          }
          
          msg += `*الإجمالي:* ${this.total} ج.م\n\n`;
          msg += `شكراً لاختياركم مرتاح دجاج ✨`;

          const phone = "201551550061";
          window.open(`https://api.whatsapp.com/send?phone=${phone}&text=${encodeURIComponent(msg)}`, '_blank');
        }
      }
    }
  </script>
</body>
</html>
